name: build-orders
on:
  push:
    paths: ['orders/queue.json']
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-orders
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-dejavu-core >/dev/null
          pip install -q pillow edge-tts
      - name: Is there a new order?
        id: chk
        run: python -c "import json,sys;q=json.load(open('orders/queue.json'));print('new=%d'%sum(1 for o in q if o.get('status')=='new'))" >> $GITHUB_OUTPUT
      - name: Build stories
        if: steps.chk.outputs.new != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python build_orders.py
      - name: Publish as private-link Release assets
        if: steps.chk.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in out/*/*/; do id=$(basename $(dirname $d)); tag="story-$id"; gh release view $tag >/dev/null 2>&1 || gh release create $tag "$d/story.mp4" "$d/story.mp3" "$d/cover.jpg" -t "Story $id" -n "Dreamtale story"; done
      - name: Save queue
        run: |
          git config user.name "dreamtale-bot"; git config user.email "bot@users.noreply.github.com"
          git add orders/queue.json; git diff --cached --quiet || { git commit -qm "orders: built"; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done; }
